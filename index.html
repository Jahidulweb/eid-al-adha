<style>
* {
  margin: 0;
  padding: 0;

  font-family: 'Hind Siliguri';
}

   @font-face {
            font-family: 'Hind Siliguri';

            font-weight: normal;
            src: url('/HindSiliguri-Regular.ttf') format('truetype');

body {
  min-height: 100vh;
  background: radial-gradient(circle at center, #063121, #02120c);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  touch-action: none;

  /*====ঈদ ব্যাকগ্রাউন্ড এলিমেন্ট====*/
.eid-bg-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* চাঁদ ও তারা */
.moon {
  position: absolute;
  top: 40px;
  right: 40px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  box-shadow: -15px 10px 0 0 #f9d976;
  filter: drop-shadow(0 0 10px #f9d976);
  transform: rotate(-15deg);
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: blink 2s infinite ease-in-out;
}

@keyframes blink {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px white; }
}

/* মসজিদের সিলুয়েট */
.mosque-silhouette {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 140px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,120 L1200,120 L1200,80 C1160,80 1140,50 1120,50 C1100,50 1080,80 1040,80 C1000,80 980,20 950,20 C920,20 900,80 860,80 C820,80 800,40 780,40 C760,40 740,80 700,80 C650,80 620,0 580,0 C540,0 510,80 460,80 C420,80 400,30 380,30 C360,30 340,80 300,80 C260,80 240,45 220,45 C200,45 180,80 140,80 C100,80 80,10 50,10 C20,10 0,80 0,80 Z" fill="%23010b07" opacity="0.5"/><path d="M0,120 L1200,120 L1200,90 C1170,90 1150,65 1135,65 C1120,65 1100,90 1060,90 C1020,90 1000,40 975,40 C950,40 930,90 890,90 C850,90 830,55 815,55 C800,55 780,90 740,90 C690,90 660,15 625,15 C590,15 560,90 510,90 C470,90 450,45 435,45 C420,45 400,90 360,90 C320,90 300,60 285,60 C270,60 250,90 210,90 C170,90 150,30 125,30 C100,30 80,90 40,90 C25,90 10,90 0,90 Z" fill="%23010704"/></svg>');
  background-size: 100% 100%;
  opacity: 0.8;
}

/*==========মেইন কার্ড==========*/

  background: none;
  border: 1px solid #00800046;
  width: 75%;
  max-width: 300px;
  min-height: 100px;
  padding: 19px 23px;
  border-radius: 20px;
  text-align: center;
  box-shadow: -15px 10px 0 0 #f9d976;
  position: relative;
  z-index: 10;
}

h1 {
  font-size: 1rem;
  margin-bottom: 20px;
  line-height: 1.4;
  color: white;
}

.jahidul-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  min-height: 80px;
}

.no-btn-wrapper {
  width: 100px;
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
}

button {
  padding: 10px 12px;
  font-size: 0.70rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  white-space: nowrap;
  transition: all 0.2s cubic-bezier(0.175,0.885,0.32,1.275);
}

#jahidul-yesBtn {
  background: linear-gradient(135deg, #d97706, #b45309);
  color: #fff;
}

#jahidul-yesBtn:active {
  transform: scale(0.9);
}

#jahidul-noBtn {
  background: #e5e7eb;
  color: #4b5563;
  transition: none; /*কত দ্রুত বাটন মুভ করবে*/
}

.jahidul-message {
  display: none;
  font-size: 18px;
  color: white;
  margin-top: 20px;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:scale(0.95);}
  to {opacity:1; transform:scale(1);}
}

/*==========ফুটার==========*/
footer {
  position: fixed;
  bottom: 35px;
  width: 100%;
  text-align: center;
  color: #ffffff;
  font-weight: bold;
  animation: glow 2s ease-in-out infinite alternate;
  z-index: 10;
}

footer p {
  margin: 0;
  font-size: 0.95rem;
  padding: 0 12px;
}

@keyframes glow {
  from {text-shadow:0 0 5px #047857,0 0 10px #ffdf7a;}
  to {text-shadow:0 0 10px #047857,0 0 20px #fff;}
}

/*==========হার্ট==========*/
.heart {
  position: fixed;
  pointer-events: none;
  animation: float 3s linear forwards;
  z-index: 1;
}

@keyframes float {
  0% {transform:translateY(0) rotate(0deg); opacity:1;}
  100% {transform:translateY(-100vh) rotate(360deg); opacity:0;}
}

<div class="eid-bg-overlay" id="stars-container">
  <div class="moon"></div>
  <div class="mosque-silhouette"></div>
</div>
<div class="tuniverse-jahidul-card">
  <div id="main-content">
    <h1>ঈদের দিন আমার সাথে মাংস কাটতে <br>আর সাইজ করতে রাজি আছো তো?</h1>

    <div class="jahidul-buttons">
      <button id="jahidul-yesBtn">হ্যাঁ, আলহামদুলিল্লাহ্</button>
      <div class="no-btn-wrapper">
        <button id="jahidul-noBtn">না, পারবো না</button>
      </div>
    </div>

    <div id="tryCounter" style="margin-top:12px;font-size:14px;color:white;min-height:18px;"></div>
  </div>

  <div class="jahidul-message" id="successMsg">
    <div style="font-size:40px;margin-bottom:10px;">🍖🐮✨</div>
    <p style="font-weight: bold">চুক্তি সম্পন্ন! ঈদের দিন সকাল সকাল চলে এসো কিন্তু। ঈদ মোবারক! 🥰</p>
  </div>
</div>

<footer>
  <p>এক দিনের কসাই 💫</p>
</footer>

<script>

  // তারকারাজি তৈরি করা
const starsContainer = document.getElementById('stars-container');
for (let i = 0; i < 40; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.width = Math.random() * 3 + 'px';
  star.style.height = star.style.width;
  star.style.top = Math.random() * 70 + 'vh';
  star.style.left = Math.random() * 100 + 'vw';
  star.style.animationDelay = Math.random() * 2 + 's';
  starsContainer.appendChild(star);
}

  
const noBtn = document.getElementById("jahidul-noBtn");
const yesBtn = document.getElementById("jahidul-yesBtn");
const msg = document.getElementById("successMsg");
const mainContent = document.getElementById("main-content");
const tryCounter = document.getElementById("tryCounter");

let yesSize = 16;
let moveCount = 0;
let noTryCount = 0;

function moveNoButton() {
  const moveDistance = 200; //কত পিক্সেল দূরে "না" বাটন সরে যাবে
  const padding = 40;
  const rect = noBtn.getBoundingClientRect();

  let newX, newY, attempts = 0;

  while (attempts < 40) {
    const angle = Math.random() * Math.PI * 2;
    newX = rect.left + Math.cos(angle) * moveDistance;
    newY = rect.top + Math.sin(angle) * moveDistance;

    if (
      newX >= padding &&
      newX <= window.innerWidth - noBtn.offsetWidth - padding &&
      newY >= padding &&
      newY <= window.innerHeight - noBtn.offsetHeight - padding
    ) break;

    attempts++;
  }

  noBtn.style.position = "fixed";
  noBtn.style.left = newX + "px";
  noBtn.style.top = newY + "px";
  noBtn.style.margin = "0";

  moveCount++;

// কতবার ক্লিক করার পর থেকে "হ্যাঁ" বাটন বড় হাওয়া শুরু হবে
  if (moveCount >= 10) {
    yesSize += 2; // প্রতি ক্লিকে কত পিক্সেল বড় হবে
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = (12 + yesSize/8) + "px " + (28 + yesSize/4) + "px";
  }
}

noBtn.addEventListener("mouseover", () => {
  noTryCount++;
  handleTryMessage();
  moveNoButton();
});

noBtn.addEventListener("touchstart", e => {
  e.preventDefault();
  noTryCount++;
  handleTryMessage();
  moveNoButton();
}, {passive:false});

yesBtn.addEventListener("click", () => {
  mainContent.style.display = "none";
  msg.style.display = "block";
  createHearts();
});

//========হার্ট ফাংশন========
function createHearts() {
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = "💮";
      h.style.left = Math.random()*100 + "vw";
      h.style.bottom = "-5vh";
      h.style.fontSize = (15 + Math.random()*20) + "px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),4000);
    }, i*80);
  }
}

//========ট্রাই মেসেজ========
function handleTryMessage() {
  if (noTryCount === 5) tryCounter.innerText = "লজ্জা না পেয়ে রাজি হয়ে যাও! 😜";
  else if (noTryCount === 8) tryCounter.innerText = "মাংস কি একা একা কাটবো? 🥺";
  else if (noTryCount === 10) tryCounter.innerText = "তোমার পালানো অসম্ভব! 🐮";
}
